<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CELL-R Grocery POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #eef4f8;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e6eef5;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05);
            max-width: 420px;
            width: 100%;
            padding: 2.25rem;
        }
        .brand-badge {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #e6f4fe;
            color: #4aa8eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1rem;
        }
        .form-control {
            border-radius: 12px;
            background: #f4f8fb;
            border: 1px solid #e6eef5;
            padding: 0.72rem 1rem;
            font-size: 0.9rem;
        }
        .form-control:focus {
            background: #ffffff;
            border-color: #4aa8eb;
            box-shadow: 0 0 0 3px rgba(74, 168, 235, 0.16);
        }
        .btn-sky-full {
            background: #4aa8eb;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 6px 16px rgba(74, 168, 235, 0.3);
            transition: all 0.15s ease;
        }
        .btn-sky-full:hover {
            background: #2b8fd9;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-badge"><i class="bi bi-cart3"></i></div>
            <h4 class="fw-bold mb-1" style="color: #1e293b;">CELL-R Grocery</h4>
            <p class="text-muted small mb-0">Quiapo, Manila • POS & Inventory System</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} rounded-3 py-2 small">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div class="form-check mb-4">
                <input type="checkbox" name="remember_me" class="form-check-input" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">Keep me signed in</label>
            </div>
            <button type="submit" class="btn-sky-full">Sign In to POS</button>
        </form>
    </div>
</body>
</html>
